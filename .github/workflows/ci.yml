name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MinkQuickLax.slnx

      - name: Build
        run: dotnet build MinkQuickLax.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution MinkQuickLax.slnx -c Release --no-build
